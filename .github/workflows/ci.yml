name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tnt
          POSTGRES_PASSWORD: tnt
          POSTGRES_DB: tnt
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U tnt -d tnt"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TNT_DATABASE_URL: postgres://tnt:tnt@localhost:5433/tnt
      TNT_TEST_DATABASE_URL: postgres://tnt:tnt@localhost:5433/tnt_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: echo "TNT_MASTER_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - run: pnpm typecheck
      - run: pnpm test
