services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: tnt
      POSTGRES_PASSWORD: tnt
      POSTGRES_DB: tnt
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tnt -d tnt"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
